name = "teke-tek"
main = "worker/index.ts"
compatibility_date = "2025-04-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ws/*"]

[[durable_objects.bindings]]
name = "MATCHMAKING"
class_name = "MatchmakingDO"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchmakingDO", "GameRoomDO"]

